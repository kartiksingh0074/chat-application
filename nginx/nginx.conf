worker_processes auto;

events {
    worker_connections 1024;
}

http {
    # Websocket upgrade requests need Connection: upgrade; plain HTTP
    # requests (REST calls, Socket.IO's initial handshake) need it absent/
    # close. Hardcoding "upgrade" for everything breaks normal keep-alive.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    upstream chat_backend {
        # zone makes the connection counts shared across all nginx worker
        # processes (worker_processes auto spawns one per CPU core) -
        # without it, least_conn is tracked per-worker in isolation, so
        # every worker independently ties at zero and picks the same
        # first backend, and load never actually balances.
        least_conn;
        zone chat_backend_zone 64k;
        server node-1:4000;
        server node-2:4000;
    }

    server {
        listen 80;

        location / {
            proxy_pass http://chat_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Chat sockets sit idle between messages; nginx's default 60s
            # proxy timeout would otherwise silently drop them.
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }
    }
}
