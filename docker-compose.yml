x-app-env: &app-env
  # Container-to-container hostnames on the compose network, not the
  # host-mapped ports (5433/6379) the app uses from outside Docker.
  DATABASE_URL: postgres://chatapp:chatapp@postgres:5432/chatapp
  REDIS_URL: redis://redis:6379
  JWT_SECRET: change-me-in-production
  JWT_EXPIRES_IN: 15m
  CORS_ORIGIN: http://localhost:5173

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: chatapp
      POSTGRES_PASSWORD: chatapp
      POSTGRES_DB: chatapp
    ports:
      # Host port 5433, not 5432: this machine also runs a native Windows
      # PostgreSQL service on 5432, and "localhost" resolving to IPv4 vs IPv6
      # could land on either listener. See docs/decisions.md.
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chatapp -d chatapp"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  worker:
    build:
      context: .
      dockerfile: server/Dockerfile
    command: ["npx", "tsx", "server/src/worker/persistWorker.ts"]
    environment:
      <<: *app-env
      NODE_ID: worker
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  node-1:
    build:
      context: .
      dockerfile: server/Dockerfile
    environment:
      <<: *app-env
      NODE_ID: node-1
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:4000/health', r => process.exit(0)).on('error', () => process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 10

  node-2:
    build:
      context: .
      dockerfile: server/Dockerfile
    environment:
      <<: *app-env
      NODE_ID: node-2
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:4000/health', r => process.exit(0)).on('error', () => process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 10

  nginx:
    image: nginx:alpine
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "8080:80"
    depends_on:
      node-1:
        condition: service_healthy
      node-2:
        condition: service_healthy

volumes:
  postgres-data:
