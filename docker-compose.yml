x-app-env: &app-env
  # Container-to-container hostnames on the compose network, not the
  # host-mapped ports (5433/6379) the app uses from outside Docker.
  DATABASE_URL: postgres://chatapp:chatapp@postgres:5432/chatapp
  REDIS_URL: redis://redis:6379
  JWT_SECRET: change-me-in-production
  JWT_EXPIRES_IN: 15m
  CORS_ORIGIN: http://localhost:5173
  # Normally 'queue'. Experiment 2 flips this to 'sync' to measure the
  # Phase 1 hot-path-write behaviour under the same load.
  PERSIST_MODE: ${PERSIST_MODE:-queue}
  # Deliberately the host-facing endpoint, not the compose hostname: this
  # value is baked into presigned URLs that the *browser* PUTs to. Signing
  # is offline, so these containers never need to reach it themselves.
  MINIO_ENDPOINT: localhost
  MINIO_PORT: 9000
  MINIO_USE_SSL: "false"
  MINIO_ACCESS_KEY: minioadmin
  MINIO_SECRET_KEY: minioadmin123
  MINIO_BUCKET: attachments

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: chatapp
      POSTGRES_PASSWORD: chatapp
      POSTGRES_DB: chatapp
    ports:
      # Host port 5433, not 5432: this machine also runs a native Windows
      # PostgreSQL service on 5432, and "localhost" resolving to IPv4 vs IPv6
      # could land on either listener. See docs/decisions.md.
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chatapp -d chatapp"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  worker:
    build:
      context: .
      dockerfile: server/Dockerfile
    command: ["npx", "tsx", "server/src/worker/persistWorker.ts"]
    environment:
      <<: *app-env
      NODE_ID: worker
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  node-1:
    build:
      context: .
      dockerfile: server/Dockerfile
    environment:
      <<: *app-env
      NODE_ID: node-1
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:4000/health', r => process.exit(0)).on('error', () => process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 10

  node-2:
    build:
      context: .
      dockerfile: server/Dockerfile
    environment:
      <<: *app-env
      NODE_ID: node-2
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:4000/health', r => process.exit(0)).on('error', () => process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 10

  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:latest
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus

  nginx:
    image: nginx:alpine
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "8080:80"
    depends_on:
      node-1:
        condition: service_healthy
      node-2:
        condition: service_healthy

volumes:
  postgres-data:
  minio-data:
  prometheus-data:
  grafana-data:
